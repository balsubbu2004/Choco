<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chocolate Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://img.freepik.com/free-psd/delicious-dark-chocolate-collection-tempting-display-broken-stacked-chocolate-bars_191095-82918.jpg?semt=ais_hybrid&w=740&q=80'); 
            background-size: cover;  
            background-position: center;   
            background-repeat: no-repeat; 
            height: 100vh;
        }
        .overlay {
            background-color: rgba(255, 255, 255, 0.8);
            min-height: 100vh;
        }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="text-center">
            <h1 class="text-dark">Choco Shop</h1>
            <p class="text-muted">Delicious chocolates</p>
        </div>

        <div class="card shadow mt-4 p-4">
            <h4 class="mb-3">Order Chocolates</h4>

            <form method="POST" action="/">
                <div class="mb-3">
                    <label for="quantity" class="form-label">Number of Chocolates</label>
                    <input type="number" class="form-control" id="quantity" name="quantity" placeholder="Enter quantity">
                </div>

                <button type="submit" class="btn btn-primary w-100">Place Order</button>
            </form>
        </div>
    </div>

</body>
</html>
